homeIntroContent = """
 I am a Staff Engineer at *Netskope*, working on Netskope Private Access, a Zero Trust Network Access (ZTNA) product. I have over 8 years of experience in building scalable and distributed backend systems, and I lead and mentor engineering teams in a cross-functional environment.

 On the side, I build products like [obiapp.in](https://obiapp.in), and I am building [llmdex.dev](https://llmdex.dev), a home for everything LLM. It started with comparing model inference prices across providers, and I plan to grow it from there.
 
 I've been involved with building 0-to-1 products for seed-funded startups to leading engineering teams for super high-growth series-funded startups.

 I began my career at *Huawei*. Following this, I ventured into the startup ecosystem with [*KeyValue Software Systems*](https://keyvalue.systems). 
 I have had the privilege of working across a multitude of domains, collaborating with numerous startups and scale-ups around the globe. 

 These days, I mostly write in *Go*. Being a polyglot, I have previously worked with *NodeJS (TypeScript)*, *Scala*, and *Java*. 
 My expertise also includes working with *Kafka*, *AWS*, *Azure*, *Kubernetes*, *Docker*, *Terraform* and more.

"""

